name: Commit File Index

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.pdf'
      - '**.txt'
      - 'generate-pdf-index.js'
      - 'generate_txt_index.py'
      - '.github/workflows/commit-file-index.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Generate PDF list (Node.js)
      run: node generate-pdf-index.js

    - name: Generate TXT list (Python)
      run: python generate_txt_index.py

    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: update file registries (PDF & TXT)"
        file_pattern: "docs/files.json docs/txt_files.json"